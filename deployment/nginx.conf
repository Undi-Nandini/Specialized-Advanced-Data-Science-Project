upstream sentiment_backend {
    least_conn;                          # least-connections load balancing
    server sentiment-svc:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Rate limit: 150 req/min per IP
    limit_req_zone $binary_remote_addr zone=nlp_zone:10m rate=150r/m;
    limit_req zone=nlp_zone burst=30 nodelay;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    gzip on;
    gzip_types application/json text/plain application/xml;
    gzip_min_length 256;

    location / {
        proxy_pass         http://sentiment_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /status {
        proxy_pass http://sentiment_backend/status;
        access_log off;
    }

    location /stats {
        proxy_pass http://sentiment_backend/stats;
    }
}
